<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@100..700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">

    <title>Categorias</title>
</head>
<body>
    <header class="encabezado">
        <h1>Categorías</h1>
    </header>

    <main class="contenido">
        <!-- Formulario para añadir categorías -->
         <form id="form-categoria" class="formulario">
            <div class="campo">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" required autocomplete="off">
            </div>

            <div class="campo">
                <label for="margen">Margen (%)</label>
                <input type="text" id="margen" name="margen" inputmode="decimal" required autocomplete="off">
            </div>
            <!-- Botón para agregar categoría o editar -->
            <button type="submit" id="boton-guardar" class="boton">Agregar categoría</button>
            <!-- Botón para cancelar edición. Sólo aparecen si se está editando una categoría -->
            <button type="button" id="cancelar-edicion" class="boton boton-secundario" hidden>Cancelar</button>
        </form>

        <!-- Mostrar mensaje si hay un error -->
        <p id="mensaje" class="mensaje" hidden></p>
        
        <!-- Listar categorías -->
        <ul id="lista-categorias" class="lista"></ul>
    </main>

    <script src="js/categorias.js"></script>
</body>
</html>
